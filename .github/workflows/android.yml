name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web and Android dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Kvara Global Group Android build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
